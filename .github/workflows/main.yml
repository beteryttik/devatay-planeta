name: Сборка мода Ninth Planet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Извлечь репозиторий
        uses: actions/checkout@v4

      - name: Настройка JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Сборка с помощью Gradle
        run: gradle build --no-daemon

      - name: Загрузить артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: ninthplanet-mod-build
          path: build/libs/*.jar
